[project]
name = "chat-bot"
version = "0.1.0"
description = "Chatbot backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "paddlepaddle==3.2.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nirf_chatbot"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"