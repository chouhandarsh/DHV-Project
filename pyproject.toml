[project]
name = "chat-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chouhandarsh", email = "darshc534@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-sarvam>=0.1",
    "pandas>=2.0",
    "plotly>=5.20",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.0",
    "streamlit>=1.36",
]
[tool.hatch.build.targets.wheel]
packages = ["src/nirf_chatbot"]
[tool.uv.build-backend]
module-name = "nirf_chatbot"
[project.scripts]
chat-bot = "nirf_chatbot.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
